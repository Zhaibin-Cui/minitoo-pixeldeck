[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minitoo-pixeldeck"
version = "0.6.0"
description = "Small screen. Big personality. Event-driven MiniToo toolkit and pixel playground."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10,<13"]
keywords = ["minitoo", "pixel-art", "bluetooth", "reverse-engineering"]

[project.optional-dependencies]
telemetry = ["psutil>=5.9,<8"]
audio = ["sounddevice>=0.5,<0.6"]
windows-input = [
    "winrt-runtime==4.1.0; sys_platform == 'win32' and python_version >= '3.11'",
    "winrt-Windows.Foundation==4!10.0.28000.2957; sys_platform == 'win32' and python_version >= '3.11'",
    "winrt-Windows.Foundation.Collections==4!10.0.28000.2957; sys_platform == 'win32' and python_version >= '3.11'",
    "winrt-Windows.Storage.Streams==4!10.0.28000.2957; sys_platform == 'win32' and python_version >= '3.11'",
    "winrt-Windows.Devices.Enumeration==4!10.0.28000.2957; sys_platform == 'win32' and python_version >= '3.11'",
    "winrt-Windows.Media==4!10.0.28000.2957; sys_platform == 'win32' and python_version >= '3.11'",
    "winrt-Windows.Media.Core==4!10.0.28000.2957; sys_platform == 'win32' and python_version >= '3.11'",
    "winrt-Windows.Media.Control==4!10.0.28000.2957; sys_platform == 'win32' and python_version >= '3.11'",
    "winrt-Windows.Media.Playback==4!10.0.28000.2957; sys_platform == 'win32' and python_version >= '3.11'",
    "winrt-Windows.Storage==4!10.0.28000.2957; sys_platform == 'win32' and python_version >= '3.11'",
]

[project.scripts]
pixeldeck = "pixeldeck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixeldeck = ["native/*.cs", "native/*.ps1", "native/*.wav"]
