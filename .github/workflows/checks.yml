name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/protocol_lab.py
      - run: python examples/driver_lab.py
      - run: python examples/pipeline_lab.py
      - run: python examples/device_lab.py
      - run: python -m pixeldeck.winrt_bridge --self-test-json
      - run: python tools/release.py --check
      - run: python -m pip wheel . --no-deps --wheel-dir dist
